<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checklists</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <main class="flex flex-col p-5 rounded-md">
        <span class="text-[7.0vh] p-5 rounded-md text-center bg-mint text-chocolate">checklists</span>
        <div>
            <div id="nav">
                <span>task</span>
                <span>deadline</span>
                <span>status</span>
                <span>desc</span>
            </div>

            <div id="tasks"></div>

            <template id="task-template">
                <div class="task">
                    <div class="name">
                        <textarea class="name-area" rows="2" cols="15" placeholder=""></textarea>
                    </div>
                    <div class="deadline">
                        <input type="date">
                    </div>
                    <div class="status">
                        <button class="status-button">not started</button>

                        <div class="options">
                            <button class="option" data-value="not-started">not started</button>
                            <button class="option" data-value="in-progress">in progress</button>
                            <button class="option" data-value="almost-finished">almost finished</button>
                            <button class="option" data-value="done">done</button>
                        </div>
                    </div>
                    <div class="desc">
                        <textarea class="desc-area" rows="6" cols="25" placeholder=""></textarea>
                    </div>
                    <button class="delete">x</button>
                </div>
            </template>
            <button id="add-task">+ new task</button>
        </div>
    </main>
    <footer>
        <span>andraguoso for snowglobe hackclub 2026 - just for fun</span>
    </footer>
    <script src="script.js"></script>
</body>

</html>
